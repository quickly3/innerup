<mat-toolbar class="toolbar">
  <mat-icon fontSet="material-symbols-outlined" class="toolbar__logo">
    self_improvement
  </mat-icon>
  <span class="toolbar__title">InnerUp</span>
  <span class="toolbar__tagline">AI 教练 · 任务线 · XP 成长</span>

  <span class="toolbar__spacer"></span>

  <nav class="nav" aria-label="主导航">
    @for (item of navItems; track item.path) {
      <a
        matButton
        class="nav__link"
        [routerLink]="item.path"
        routerLinkActive="nav__link--active"
        ariaCurrentWhenActive="page"
        [attr.aria-label]="item.label"
      >
        <mat-icon fontSet="material-symbols-outlined" class="nav__icon">
          {{ item.icon }}
        </mat-icon>
        <span class="nav__label">{{ item.label }}</span>
      </a>
    }
  </nav>
</mat-toolbar>

<main class="app-main">
  <router-outlet />
</main>
